services:
  # KSD backend (own API + ksdDB) — free plan sleeps; wakes on next HTTPS request
  - type: web
    name: ksd-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      - key: SEED_FORCE
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:aj88XpPJzbIddp3m@cluster0.i8fmp7m.mongodb.net/ksdDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: australia
      - key: ADMIN_EMAIL
        value: admin@ksdhomes.com.au
      - key: ADMIN_PASSWORD
        value: India007$
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: ashishsingh0828@gmail.com
      - key: EMAIL_PASS
        value: abcdefghijklmnop
      - key: NOTIFICATION_EMAIL
        value: admin@ksdhomes.com.au
      - key: ADMIN_URL
        value: https://ksd-australia-site.onrender.com/admin

  # KSD website + admin on same host: / and /admin
  - type: web
    name: ksd-australia-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: npm install && npm run build && npm --prefix admin install && VITE_BASE=/admin/ VITE_USE_MOCK=false VITE_SITE=australia VITE_API_URL=https://ksd-backend-api.onrender.com VITE_AUSTRALIA_URL=https://ksd-australia-site.onrender.com npm --prefix admin run build && rm -rf dist/admin && mkdir -p dist/admin && cp -R admin/dist/. dist/admin/
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ksd-backend-api.onrender.com
