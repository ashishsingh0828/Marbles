# ---------------------------------------------------------------------------
# Monorepo blueprint (ashishsingh0828/Marbles) - one API + one admin per website.
#
#   India  (IE Marbles) : india-backend-api  <- india-admin-panel   -> marbles-india-site
#   KSD    (Australia)  : ksd-backend-api    <- ksd-admin-panel     -> ksd-australia-site
#
# Admin -> website sync: the admin panel writes to its OWN backend API (MongoDB Atlas), and the public
# website reads from that SAME backend. So VITE_API_URL of site + admin must be the same URL, and the
# backend must use a persistent MONGO_URI (never MONGO_LOCAL=true, never SEED_FORCE in production).
# VITE_API_URL values are full https:// URLs because Render's "host" property omits ".onrender.com".
# ---------------------------------------------------------------------------
services:
  # ---------------------------------------------------------------------------
  # INDIA backend (own API + indiaDB)
  # ---------------------------------------------------------------------------
  - type: web
    name: india-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: India-server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      # Seed runs once per site/type; SEED_FORCE is ignored in production so admin edits are never wiped.
      - key: SEED_FORCE
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:aj88XpPJzbIddp3m@cluster0.i8fmp7m.mongodb.net/indiaDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: india
      - key: ADMIN_EMAIL
        value: ie
      - key: ADMIN_PASSWORD
        value: iemarbles@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: iemarbletraders@gmail.com
      - key: EMAIL_PASS
        value: lqjjlvgywogbtbxc
      - key: MAIL_FROM
        value: IE Marbles <iemarbletraders@gmail.com>
      - key: NOTIFICATION_EMAIL
        value: iemarbletraders@gmail.com

  # ---------------------------------------------------------------------------
  # INDIA public website - IE Marbles (static)
  # ---------------------------------------------------------------------------
  - type: web
    name: marbles-india-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: India
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://india-backend-api.onrender.com

  # ---------------------------------------------------------------------------
  # INDIA admin panel (locked to the india site + india backend)
  # ---------------------------------------------------------------------------
  - type: web
    name: india-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: India-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: india
      - key: VITE_API_URL
        value: https://india-backend-api.onrender.com
      - key: VITE_INDIA_URL
        value: https://marbles-india-site.onrender.com

  # ---------------------------------------------------------------------------
  # KSD / AUSTRALIA backend (own API + ksdDB)
  # ---------------------------------------------------------------------------
  - type: web
    name: ksd-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: Australia-server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      # Was "true" -> every restart wiped admin edits. Seed now runs once and SEED_FORCE is ignored in production.
      - key: SEED_FORCE
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:aj88XpPJzbIddp3m@cluster0.jfbjbp9.mongodb.net/ksdDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: australia
      - key: ADMIN_EMAIL
        value: admin
      - key: ADMIN_PASSWORD
        value: ksd@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: ashishsingh0828@gmail.com
      - key: EMAIL_PASS
        value: abcdefghijklmnop
      - key: NOTIFICATION_EMAIL
        value: ashishsingh0828@gmail.com

  # ---------------------------------------------------------------------------
  # KSD / AUSTRALIA public website (static)
  # ---------------------------------------------------------------------------
  - type: web
    name: ksd-australia-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: Australia
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ksd-backend-api.onrender.com

  # ---------------------------------------------------------------------------
  # KSD / AUSTRALIA admin panel (locked to the australia site + ksd backend)
  # ---------------------------------------------------------------------------
  - type: web
    name: ksd-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: Australia-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: australia
      - key: VITE_API_URL
        value: https://ksd-backend-api.onrender.com
      - key: VITE_AUSTRALIA_URL
        value: https://ksd-australia-site.onrender.com
