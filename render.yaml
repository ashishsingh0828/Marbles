services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (Node.js + Express + MongoDB Atlas)
  # ---------------------------------------------------------------------------
  - type: web
    name: marbles-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:moGWkSR3SLs1gRY8@cluster0.lveqgsk.mongodb.net/marbleDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: ADMIN_EMAIL
        value: admin
      - key: ADMIN_PASSWORD
        value: ksd@123
      - key: ADMIN_EMAIL_2
        value: ie
      - key: ADMIN_PASSWORD_2
        value: iemarbles@123
      - key: SITES
        value: india,australia
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: ashishsingh0828@gmail.com
      - key: EMAIL_PASS
        value: abcdefghijklmnop
      - key: NOTIFICATION_EMAIL
        value: ashishsingh0828@gmail.com

  # ---------------------------------------------------------------------------
  # 2. India Website - IE Marbles (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: marbles-india-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: India
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: marbles-backend-api
          property: host

  # ---------------------------------------------------------------------------
  # 3. Australia Website - KSD Homes (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: ksd-australia-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: Australia
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: marbles-backend-api
          property: host

  # ---------------------------------------------------------------------------
  # 4. Multi-Site Admin Panel (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: marbles-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        fromService:
          type: web
          name: marbles-backend-api
          property: host
      - key: VITE_INDIA_URL
        fromService:
          type: web
          name: marbles-india-site
          property: host
      - key: VITE_AUSTRALIA_URL
        fromService:
          type: web
          name: ksd-australia-site
          property: host

  # ---------------------------------------------------------------------------
  # 5. KSD Homes admin (Australia only)
  # ---------------------------------------------------------------------------
  - type: web
    name: ksd-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: Australia-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: australia
      - key: VITE_API_URL
        fromService:
          type: web
          name: marbles-backend-api
          property: host
      - key: VITE_AUSTRALIA_URL
        fromService:
          type: web
          name: ksd-australia-site
          property: host

  # ---------------------------------------------------------------------------
  # 6. IE Marbles admin (India only)
  # ---------------------------------------------------------------------------
  - type: web
    name: india-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: India-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: india
      - key: VITE_API_URL
        fromService:
          type: web
          name: marbles-backend-api
          property: host
      - key: VITE_INDIA_URL
        fromService:
          type: web
          name: marbles-india-site
          property: host
