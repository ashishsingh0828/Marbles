# ---------------------------------------------------------------------------
# Monorepo blueprint — prefer India.git / Australia.git split deploys.
# Free backends sleep; next HTTPS request wakes them (first hit can take 30–90s).
#
# Combined site URLs after deploy:
#   India: https://marbles-india-site.onrender.com/        (site)
#          https://marbles-india-site.onrender.com/admin/  (admin)
#   KSD:   https://ksd-australia-site.onrender.com/
#          https://ksd-australia-site.onrender.com/admin/
# ---------------------------------------------------------------------------
services:
  - type: web
    name: india-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: India-server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      - key: SEED_FORCE
        value: "false"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:aj88XpPJzbIddp3m@cluster0.i8fmp7m.mongodb.net/indiaDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: india
      - key: ADMIN_EMAIL
        value: ie
      - key: ADMIN_PASSWORD
        value: iemarbles@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: iemarbletraders@gmail.com
      - key: EMAIL_PASS
        value: lqjjlvgywogbtbxc
      - key: MAIL_FROM
        value: IE Marbles <iemarbletraders@gmail.com>
      - key: NOTIFICATION_EMAIL
        value: iemarbletraders@gmail.com

  - type: web
    name: marbles-india-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: India
    buildCommand: npm install && npm run build && npm --prefix ../India-admin install && VITE_BASE=/admin/ VITE_USE_MOCK=false VITE_SITE=india VITE_API_URL=https://india-backend-api.onrender.com VITE_INDIA_URL=https://marbles-india-site.onrender.com npm --prefix ../India-admin run build && rm -rf dist/admin && mkdir -p dist/admin && cp -R ../India-admin/dist/. dist/admin/
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://india-backend-api.onrender.com

