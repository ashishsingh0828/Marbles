services:
  - type: web
    name: ksd-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SITES
        value: australia
      - key: ADMIN_EMAIL
        value: admin
      - key: ADMIN_PASSWORD
        value: ksd@123
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: ksd-australia-site
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ksd-backend-api
          property: host

  - type: web
    name: ksd-admin-panel
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: australia
      - key: VITE_API_URL
        fromService:
          type: web
          name: ksd-backend-api
          property: host
