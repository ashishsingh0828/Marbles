services:
  # Australia / KSD backend (own API + ksdDB)
  - type: web
    name: ksd-backend-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_LOCAL
        value: "false"
      - key: SEED_FORCE
        value: "true"
      - key: MONGO_URI
        value: mongodb+srv://ashishsingh0828_db_user:moGWkSR3SLs1gRY8@cluster0.lveqgsk.mongodb.net/ksdDB?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        value: f7e3c9a184b260d8e4f1a59c7b3d2e619483017a4b8c9e2f50d1a7b3c6e9f2a4
      - key: SITES
        value: australia
      - key: ADMIN_EMAIL
        value: admin
      - key: ADMIN_PASSWORD
        value: ksd@123
      - key: CORS_ORIGINS
        value: "*"
      - key: EMAIL_USER
        value: ashishsingh0828@gmail.com
      - key: EMAIL_PASS
        value: abcdefghijklmnop
      - key: NOTIFICATION_EMAIL
        value: ashishsingh0828@gmail.com

  # Australia public website
  - type: web
    name: ksd-australia-site
    runtime: static
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full HTTPS URL — Render "host" alone can omit .onrender.com and break login
      - key: VITE_API_URL
        value: https://ksd-backend-api.onrender.com

  # Australia admin panel (locked to australia site + KSD backend)
  - type: web
    name: ksd-admin-panel
    runtime: static
    autoDeployTrigger: commit
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SITE
        value: australia
      - key: VITE_API_URL
        value: https://ksd-backend-api.onrender.com
      - key: VITE_AUSTRALIA_URL
        value: https://ksd-australia-site.onrender.com
